<!-- Android Home Screen Shortcut Icon (Bypasses the manifest file) -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Colour Rotation Chart</title>
    <style>
        /* Reset margins and force full viewport height */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: sans-serif;
        }

        /* Fixed Header Frame - PINNED to top-left */
        #header-container {
            width: 100%;
            height: 168px; 
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10;
            background-color: #ffffff;
            text-align: left; 
            display: flex;
            align-items: center; 
        }
        
        /* The Actual Graphic Styling */
        #header-container img {
            margin-left: 0; 
            max-width: 100%; 
            height: auto; 
            max-height: 168px; 
            object-fit: contain; 
            object-position: left; 
        }

        /* Scrolling Spreadsheet Frame */
        #sheet-container {
            position: absolute;
            top: 168px; /* Matches header height */
            bottom: 0;
            width: 100%;
            overflow: hidden;
        }
        
        iframe {
            width: 100%;
            height: 100%; /* Changed from calc(100% + 45px) */
            border: none;
            margin-top: 0px; /* Changed from -45px so Row 1 is fully visible */
        }
    </style>
</head>
<body>

    <!-- 1. Locked, Left-Aligned Graphic Header -->
    <div id="header-container">
        <img src="https://i.imgur.com/DbsayBy.png" alt="Colour Rotation Chart Header">
    </div>

    <!-- 2. Live, Scrolling Google Sheet -->
    <div id="sheet-container">
        <iframe src="https://docs.google.com/spreadsheets/d/1RtI2H2PXq0EUJPGSQoGZVyfgszamK_Y0897BNY56wb0/preview"></iframe>
    </div>

</body>
</html>
